[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-platform"
version = "0.1.0"
description = "Ingestion layer for Spanish electricity market (REE) and weather (AEMET) data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.30"]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
energy-ingest = "energy_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Globals injected by the Databricks runtime
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"databricks/**" = ["E402"]
